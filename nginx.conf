# ============================================================================
# CẤU HÌNH NGINX CÂN BẰNG TẢI & TỐI ƯU HIỆU NĂNG CHO 2 VPS ĐẤT PHÚ
# Đường dẫn tham khảo: /etc/nginx/conf.d/datphu.conf
# ============================================================================

# Giới hạn số file mở tối đa của Nginx
# worker_rlimit_nofile 65535;

# 1. KHAI BÁO CỤM CÂN BẰNG TẢI 2 VPS (UPSTREAM)
upstream datphu_backend_cluster {
    least_conn; # Điều phối theo thuật toán số kết nối ít nhất

    # VPS 1 (Local): 4 instances Node.js qua PM2 Cluster
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s weight=5;

    # VPS 2 (Private IP qua mạng nội bộ / WireGuard / VPC): 4 instances
    server 10.0.0.2:5000 max_fails=3 fail_timeout=10s weight=5;

    # Duy trì kết nối sống để tránh tiêu tốn bắt tay TCP
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name datphu.vn www.datphu.vn;

    # Tự động chuyển hướng toàn bộ sang HTTPS an toàn
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name datphu.vn www.datphu.vn;

    # Chứng chỉ SSL Let's Encrypt / Cloudflare Origin
    ssl_certificate /etc/letsencrypt/live/datphu.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datphu.vn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;

    # 2. BẬT NÉN DỮ LIỆU GZIP SIÊU NHẸ (GIẢM 75% BĂNG THÔNG CHO BÀ CON NÔNG THÔN)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    root /var/www/datphu-backend/public;
    index lich_thien_van_sinh_ke.html index.html;

    # 3. PHỤC VỤ FILE TĨNH TRỰC TIẾP TỪ Ổ CỨNG NVMe (KHÔNG QUA NODE.JS)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # 4. ĐIỀU PHỐI CÁC API THIÊN VĂN & BÁN HÀNG VÀO CỤM 2 VPS
    location /api/ {
        proxy_pass http://datphu_backend_cluster;
        proxy_http_version 1.1;

        # Giữ kết nối HTTP Keepalive
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Bộ đệm proxy
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;

        # Thời gian chờ
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 5. KÊNH BÁO ĐỘNG LŨ REALTIME SERVER-SENT EVENTS (SSE)
    location /api/realtime {
        proxy_pass http://datphu_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s; # Giữ kết nối mở cho điện thoại nhận tin lũ
    }

    # 6. GIAO DIỆN CHÍNH
    location / {
        try_files $uri $uri/ /lich_thien_van_sinh_ke.html;
    }
}
