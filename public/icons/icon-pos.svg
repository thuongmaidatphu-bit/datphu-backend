<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="dpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#f97316" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#030712" />

  <!-- Outer Ring / Glow -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#dpGrad)" filter="url(#glow)" />
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="6" />

  <!-- Content: ĐP and Cash Register -->
  <g fill="#ffffff" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif">
    <text x="256" y="270" font-size="160" font-weight="900" letter-spacing="-4">ĐP</text>
  </g>

  <!-- Sub-badge: MINI POS -->
  <rect x="116" y="325" width="280" height="58" rx="29" fill="#0f172a" stroke="#fef08a" stroke-width="3" />
  <text x="256" y="364" fill="#fef08a" text-anchor="middle" font-size="30" font-weight="900" letter-spacing="4" font-family="'Inter', -apple-system, sans-serif">MINI POS</text>
</svg>