<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đất Phú Speed POS - Chuẩn Tinh Gọn</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* Chống bôi đen văn bản khi chạm màn hình cảm ứng */
    body { user-select: none; -webkit-user-select: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col overflow-hidden font-sans">

  <!-- TOP BAR: TỐC ĐỘ & DOANH THU HÔM NAY -->
  <header class="h-12 bg-blue-800 text-white px-4 flex items-center justify-between shrink-0 shadow-md">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-bolt text-amber-400 text-lg"></i>
      <h1 class="font-black text-sm uppercase tracking-wider">ĐẤT PHÚ SPEED POS</h1>
      <span class="text-[10px] bg-blue-700 px-2 py-0.5 rounded text-blue-200">Chuẩn iPOS Tinh Gọn</span>
    </div>
    <div class="flex items-center space-x-4 text-xs font-bold">
      <span id="clockText">--:--</span>
      <span class="bg-blue-900 px-3 py-1 rounded-lg border border-blue-700">
        Doanh thu: <span id="todayRevText" class="text-amber-400 font-mono font-black">0 đ</span>
      </span>
    </div>
  </header>

  <!-- BODY: CHIA 3 KHÔNG GIAN CÔNG THÁI HỌC -->
  <main class="flex-1 flex overflow-hidden">
    
    <!-- CỘT 1: SƠ ĐỒ BÀN (CHỈ CÓ 2 MÀU: TRẮNG = TRỐNG, XANH = CÓ KHÁCH) -->
    <section class="w-1/4 border-r border-slate-300 bg-slate-50 flex flex-col">
      <div class="p-2.5 bg-white border-b border-slate-200 font-black text-xs text-slate-700 flex justify-between">
        <span>SƠ ĐỒ BÀN (12 BÀN)</span>
        <span class="text-slate-400 font-normal">Trắng: Trống • Xanh: Có khách</span>
      </div>
      <div class="flex-1 p-2 overflow-y-auto grid grid-cols-2 gap-2" id="tableGrid">
        <!-- Render bàn qua JavaScript -->
      </div>
    </section>

    <!-- CỘT 2: THỰC ĐƠN GỌI MÓN (PHÍM BẤM TO NHƯ BAO DIÊM) -->
    <section class="flex-1 flex flex-col bg-slate-100 border-r border-slate-300">
      <!-- Bộ lọc danh mục -->
      <div class="p-2 bg-white border-b border-slate-200 flex gap-2">
        <button onclick="filterCat('all')" id="catBtn-all" class="cat-btn px-4 py-1.5 rounded-lg text-xs font-bold bg-blue-600 text-white shadow-xs">Tất Cả</button>
        <button onclick="filterCat('food')" id="catBtn-food" class="cat-btn px-4 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-700 hover:bg-slate-200">Món Ăn</button>
        <button onclick="filterCat('drink')" id="catBtn-drink" class="cat-btn px-4 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-700 hover:bg-slate-200">Đồ Uống</button>
      </div>
      <!-- Lưới món ăn -->
      <div class="flex-1 p-3 overflow-y-auto grid grid-cols-2 sm:grid-cols-3 gap-2.5" id="productGrid">
        <!-- Render món qua JavaScript -->
      </div>
    </section>

    <!-- CỘT 3: HÓA ĐƠN & THU TIỀN (1 CHẠM LÀ XONG) -->
    <section class="w-1/3 bg-white flex flex-col shadow-lg">
      <!-- Tiêu đề bàn đang phục vụ -->
      <div class="p-3 bg-blue-50 border-b border-blue-200 flex items-center justify-between">
        <div>
          <h2 id="curTableTitle" class="font-black text-sm text-blue-900 uppercase">BÀN 1</h2>
          <span id="curTableTime" class="text-[10px] text-slate-500">Giờ vào: --:--</span>
        </div>
        <button onclick="clearCurrentCart()" class="text-red-500 text-xs font-bold hover:underline" title="Hủy giỏ">Xóa hết</button>
      </div>

      <!-- Danh sách món của bàn -->
      <div class="flex-1 p-2 overflow-y-auto" id="orderItemsList">
        <!-- Render giỏ hàng -->
      </div>

      <!-- Chân hóa đơn: Tổng tiền & 2 Nút lớn Báo Bếp / Thanh Toán -->
      <div class="p-3 bg-slate-50 border-t border-slate-200 space-y-2">
        <div class="flex justify-between items-baseline">
          <span class="text-xs text-slate-500 font-bold">Tổng Thanh Toán:</span>
          <span id="cartTotalText" class="text-xl font-black font-mono text-red-600">0 đ</span>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <!-- NÚT 1: BÁO BẾP -->
          <button onclick="sendToKitchen()" class="py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs rounded-xl shadow-md flex items-center justify-center gap-1 active:scale-95 transition cursor-pointer">
            <i class="fa-solid fa-bell"></i> BÁO BẾP
          </button>
          <!-- NÚT 2: THANH TOÁN (VIETQR / TIỀN MẶT) -->
          <button onclick="openCheckout()" class="py-2.5 bg-red-600 hover:bg-red-700 text-white font-black text-xs rounded-xl shadow-md flex items-center justify-center gap-1 active:scale-95 transition cursor-pointer">
            <i class="fa-solid fa-credit-card"></i> THANH TOÁN
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- MODAL THANH TOÁN VIETQR & TIỀN MẶT SIÊU GỌN -->
  <div id="checkoutModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-sm p-4 shadow-2xl flex flex-col items-center">
      <h3 class="font-black text-base text-slate-800 mb-1" id="checkoutTitle">THANH TOÁN BÀN 1</h3>
      <p class="text-2xl font-black font-mono text-red-600 mb-3" id="checkoutAmount">0 đ</p>
      
      <!-- Mã VietQR Động Sinh Ngay -->
      <div class="bg-slate-100 p-2 rounded-xl border border-slate-200 mb-3 text-center w-full">
        <img id="qrImage" src="" alt="Mã VietQR" class="w-44 h-44 object-contain mx-auto rounded-lg">
        <span class="text-[10px] text-slate-500 block mt-1 font-semibold">Quét mã VietQR bằng bất kỳ App Ngân Hàng nào</span>
      </div>

      <div class="w-full grid grid-cols-2 gap-2">
        <button onclick="closeCheckout()" class="py-2 rounded-xl bg-slate-200 hover:bg-slate-300 font-bold text-xs text-slate-700 cursor-pointer">Đóng</button>
        <button onclick="completeOrder()" class="py-2 rounded-xl bg-green-600 hover:bg-green-700 font-black text-xs text-white shadow-md cursor-pointer">Đã Nhận Tiền ✓</button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT: LOGIC TINH GỌN HOÀN TOÀN (350 DÒNG) -->
  <script>
    // 1. DỮ LIỆU CỐT LÕI
    let tables = JSON.parse(localStorage.getItem('dp_speed_tables')) || Array.from({ length: 12 }, (_, i) => ({
      id: i + 1,
      name: "Bàn " + (i + 1),
      status: "empty",
      cart: [],
      openTime: null
    }));

    const products = [
      { id: 1, name: "Bún Cá Dằm", price: 35000, cat: "food" },
      { id: 2, name: "Bún Chả Cá", price: 40000, cat: "food" },
      { id: 3, name: "Bún Thập Cẩm", price: 50000, cat: "food" },
      { id: 4, name: "Cà Phê Đen Đá", price: 15000, cat: "drink" },
      { id: 5, name: "Cà Phê Sữa Đá", price: 18000, cat: "drink" },
      { id: 6, name: "Bạc Xỉu", price: 20000, cat: "drink" },
      { id: 7, name: "Trà Đào Cam Sả", price: 25000, cat: "drink" },
      { id: 8, name: "Nước Ngọt Lon", price: 15000, cat: "drink" },
      { id: 9, name: "Trà Đá", price: 3000, cat: "drink" }
    ];

    let currentTableId = 1;
    let currentCat = 'all';
    let todayRevenue = parseInt(localStorage.getItem('dp_speed_rev') || '0');

    function saveState() {
      localStorage.setItem('dp_speed_tables', JSON.stringify(tables));
      localStorage.setItem('dp_speed_rev', todayRevenue.toString());
    }

    // Chuông bíp audio
    function playBeep(freq = 800, dur = 0.08) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + dur);
        osc.start(); osc.stop(ctx.currentTime + dur);
      } catch (e) {}
    }

    // 2. RENDER SƠ ĐỒ BÀN (Chỉ 2 màu Trắng và Xanh)
    function renderTables() {
      const grid = document.getElementById('tableGrid');
      grid.innerHTML = tables.map(t => {
        const isActive = t.id === currentTableId;
        const isOcc = t.status === 'occupied' && t.cart.length > 0;
        const total = t.cart.reduce((s, x) => s + x.price * x.qty, 0);

        return `
          <div onclick="selectTable(${t.id})" class="p-2.5 rounded-xl border-2 transition cursor-pointer flex flex-col justify-between ${isActive ? 'ring-2 ring-blue-600 border-blue-600' : ''} ${isOcc ? 'bg-emerald-50 border-emerald-400' : 'bg-white border-slate-200'}">
            <div class="flex justify-between items-start">
              <span class="font-black text-xs ${isOcc ? 'text-emerald-900' : 'text-slate-800'}">${t.name}</span>
              <span class="text-[9px] px-1.5 py-0.2 rounded-full font-bold ${isOcc ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-500'}">
                ${isOcc ? t.cart.reduce((s, x) => s + x.qty, 0) + ' món' : 'Trống'}
              </span>
            </div>
            <div class="mt-2 text-right">
              <span class="font-mono text-xs font-black ${isOcc ? 'text-emerald-700' : 'text-slate-400'}">
                ${total > 0 ? total.toLocaleString('vi-VN') + ' đ' : '0 đ'}
              </span>
            </div>
          </div>
        `;
      }).join('');
    }

    // 3. RENDER MÓN ĂN
    function renderProducts() {
      const grid = document.getElementById('productGrid');
      const filtered = currentCat === 'all' ? products : products.filter(p => p.cat === currentCat);

      grid.innerHTML = filtered.map(p => `
        <button onclick="addToOrder(${p.id})" class="p-3 bg-white rounded-xl border border-slate-200 hover:border-blue-400 hover:bg-blue-50/30 shadow-2xs flex flex-col justify-between text-left active:scale-95 transition cursor-pointer">
          <span class="font-black text-xs text-slate-800 leading-tight mb-1">${p.name}</span>
          <span class="font-mono text-xs font-bold text-blue-700">${p.price.toLocaleString('vi-VN')} đ</span>
        </button>
      `).join('');
    }

    // 4. THAO TÁC ORDER
    function selectTable(id) {
      currentTableId = id;
      renderTables();
      renderCart();
      playBeep(600, 0.04);
    }

    function addToOrder(prodId) {
      const t = tables.find(x => x.id === currentTableId);
      const p = products.find(x => x.id === prodId);
      const exist = t.cart.find(x => x.id === prodId);

      if (exist) exist.qty += 1;
      else t.cart.push({ id: p.id, name: p.name, price: p.price, qty: 1 });

      if (!t.openTime) t.openTime = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
      t.status = 'occupied';

      playBeep(850, 0.04);
      saveState();
      renderTables();
      renderCart();
    }

    function updateQty(prodId, delta) {
      const t = tables.find(x => x.id === currentTableId);
      const item = t.cart.find(x => x.id === prodId);
      if (!item) return;

      item.qty += delta;
      if (item.qty <= 0) t.cart = t.cart.filter(x => x.id !== prodId);
      if (t.cart.length === 0) {
        t.status = 'empty';
        t.openTime = null;
      }

      saveState();
      renderTables();
      renderCart();
    }

    function clearCurrentCart() {
      const t = tables.find(x => x.id === currentTableId);
      if (t.cart.length === 0) return;
      if (confirm("Xóa toàn bộ món của " + t.name + "?")) {
        t.cart = [];
        t.status = 'empty';
        t.openTime = null;
        saveState();
        renderTables();
        renderCart();
      }
    }

    function renderCart() {
      const t = tables.find(x => x.id === currentTableId);
      document.getElementById('curTableTitle').textContent = t.name.toUpperCase();
      document.getElementById('curTableTime').textContent = t.openTime ? "Giờ vào: " + t.openTime : "Chưa có khách";

      const list = document.getElementById('orderItemsList');
      if (t.cart.length === 0) {
        list.innerHTML = `<div class="text-center py-12 text-slate-400 text-xs italic">Bàn đang trống • Chạm vào món để chọn</div>`;
      } else {
        list.innerHTML = t.cart.map(item => `
          <div class="flex items-center justify-between py-1.5 border-b border-slate-100 text-xs">
            <span class="font-bold flex-1 truncate pr-1">${item.name}</span>
            <div class="flex items-center space-x-1.5 shrink-0">
              <button onclick="updateQty(${item.id}, -1)" class="w-5 h-5 rounded bg-slate-200 text-slate-700 font-bold flex items-center justify-center cursor-pointer">-</button>
              <span class="font-mono font-bold w-4 text-center">${item.qty}</span>
              <button onclick="updateQty(${item.id}, 1)" class="w-5 h-5 rounded bg-blue-600 text-white font-bold flex items-center justify-center cursor-pointer">+</button>
              <span class="font-mono font-bold w-16 text-right">${(item.price * item.qty).toLocaleString('vi-VN')}đ</span>
            </div>
          </div>
        `).join('');
      }

      const total = t.cart.reduce((s, x) => s + x.price * x.qty, 0);
      document.getElementById('cartTotalText').textContent = total.toLocaleString('vi-VN') + ' đ';
    }

    // 5. BÁO BẾP (Kêu Ding-Dong)
    function sendToKitchen() {
      const t = tables.find(x => x.id === currentTableId);
      if (t.cart.length === 0) return alert("Bàn chưa có món!");
      
      playBeep(650, 0.1);
      setTimeout(() => playBeep(950, 0.2), 120);
      alert("✓ ĐÃ BÁO BẾP: " + t.name + " (" + t.cart.reduce((s, x) => s + x.qty, 0) + " món)!");
    }

    // 6. THANH TOÁN (VIETQR ĐỘNG)
    function openCheckout() {
      const t = tables.find(x => x.id === currentTableId);
      const total = t.cart.reduce((s, x) => s + x.price * x.qty, 0);
      if (total <= 0) return alert("Chưa có món để thanh toán!");

      document.getElementById('checkoutTitle').textContent = "THANH TOÁN " + t.name.toUpperCase();
      document.getElementById('checkoutAmount').textContent = total.toLocaleString('vi-VN') + " đ";

      // Sinh mã VietQR động theo chuẩn Napas 247
      const qrUrl = `https://img.vietqr.io/image/970422-0905123456-compact2.png?amount=${total}&addInfo=Ban${t.id}&accountName=QUAN%20DAT%20PHU`;
      document.getElementById('qrImage').src = qrUrl;

      document.getElementById('checkoutModal').classList.remove('hidden');
    }

    function closeCheckout() {
      document.getElementById('checkoutModal').classList.add('hidden');
    }

    function completeOrder() {
      const t = tables.find(x => x.id === currentTableId);
      const total = t.cart.reduce((s, x) => s + x.price * x.qty, 0);

      todayRevenue += total;
      document.getElementById('todayRevText').textContent = todayRevenue.toLocaleString('vi-VN') + " đ";

      // Đóng bàn, trả về trạng thái Trống ngay lập tức
      t.cart = [];
      t.status = "empty";
      t.openTime = null;

      saveState();
      closeCheckout();
      renderTables();
      renderCart();
      playBeep(1000, 0.15);
      alert("✓ Đã hoàn tất thanh toán & đóng bàn thành công!");
    }

    function filterCat(cat) {
      currentCat = cat;
      ['all', 'food', 'drink'].forEach(c => {
        const btn = document.getElementById('catBtn-' + c);
        if (btn) {
          if (c === cat) {
            btn.className = "cat-btn px-4 py-1.5 rounded-lg text-xs font-bold bg-blue-600 text-white shadow-xs cursor-pointer";
          } else {
            btn.className = "cat-btn px-4 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 cursor-pointer";
          }
        }
      });
      renderProducts();
    }

    // Khởi tạo
    document.getElementById('todayRevText').textContent = todayRevenue.toLocaleString('vi-VN') + " đ";
    renderTables();
    renderProducts();
    renderCart();
    setInterval(() => {
      document.getElementById('clockText').textContent = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
    }, 1000);
  </script>
</body>
</html>
