<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="terraceFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="glassRail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- Cảnh cây xanh & Khu nhà phía xa -->
  <rect width="400" height="140" fill="#e0f2fe"/>
  <circle cx="55" cy="95" r="45" fill="#1e2260" opacity="0.18"/>
  <circle cx="120" cy="88" r="52" fill="#1e2260" opacity="0.24"/>
  <!-- Ngôi nhà mái ngói đỏ phía xa -->
  <rect x="175" y="42" width="95" height="75" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <polygon points="168,42 222,16 276,42" fill="#d7262d"/>
  <rect x="212" y="56" width="18" height="22" rx="2" fill="#1e2260"/>

  <!-- Tường nhà & Cửa kính bên phải sân thượng -->
  <polygon points="310,0 400,0 400,260 310,135" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <polygon points="328,15 392,15 392,225 328,130" fill="#bae6fd" opacity="0.55" stroke="#ffffff" stroke-width="3"/>

  <!-- Lan can kính cường lực & Trụ Inox xung quanh sân thượng -->
  <polygon points="0,155 148,108 310,115 310,145 148,138 0,192" fill="url(#glassRail)" stroke="#64748b" stroke-width="2"/>
  <!-- Tay vịn inox -->
  <polyline points="0,155 148,108 310,115" fill="none" stroke="#1e2260" stroke-width="4.5"/>
  <!-- Các trụ inox đứng -->
  <line x1="52" y1="138" x2="52" y2="174" stroke="#334155" stroke-width="4"/>
  <line x1="148" y1="108" x2="148" y2="138" stroke="#334155" stroke-width="4"/>
  <line x1="230" y1="111" x2="230" y2="141" stroke="#334155" stroke-width="4"/>

  <!-- Mặt Sàn Sân Thượng Lát Gạch Chống Thấm Phối Cảnh 3D -->
  <polygon points="0,192 148,138 310,145 400,265 400,300 0,300" fill="url(#terraceFloor)"/>
  <!-- Gờ chân tường chống thấm -->
  <polyline points="0,192 148,138 310,145 400,265" fill="none" stroke="#f8fafc" stroke-width="6"/>

  <!-- Đường ron gạch chống thấm sân thượng phối cảnh -->
  <g stroke="#cbd5e1" stroke-width="1.6" opacity="0.65">
    <line x1="148" y1="138" x2="45" y2="300"/>
    <line x1="188" y1="140" x2="135" y2="300"/>
    <line x1="228" y1="142" x2="225" y2="300"/>
    <line x1="268" y1="143" x2="315" y2="300"/>
    <line x1="42" y1="178" x2="332" y2="175"/>
    <line x1="12" y1="215" x2="362" y2="215"/>
    <line x1="0" y1="258" x2="395" y2="258"/>
  </g>

  <!-- Huy hiệu Khiên Chống Thấm Sika / Đất Phú 6K nổi bật trên mặt sàn -->
  <g transform="translate(195, 224)">
    <path d="M0 -34 L28 -22 V4 C28 22 0 34 0 34 C0 34 -28 22 -28 4 V-22 Z" fill="#1e2260" stroke="#ffffff" stroke-width="3"/>
    <path d="M0 -18 C0 -18 -11 -4 -11 5 A11 11 0 0 0 11 5 C11 -4 0 -18 0 -18 Z" fill="#d7262d" stroke="#ffffff" stroke-width="1.5"/>
  </g>
</svg>
