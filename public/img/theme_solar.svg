<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="pvCell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e2260"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Bầu trời & Biển Tuy Hòa Phú Yên -->
  <rect width="400" height="190" fill="url(#sky)"/>
  <rect x="0" y="160" width="400" height="45" fill="#0284c7" opacity="0.75"/>
  <rect x="0" y="195" width="400" height="105" fill="#cbd5e1"/>

  <!-- Mặt trời tỏa năng lượng -->
  <circle cx="62" cy="52" r="24" fill="#facc15" stroke="#f59e0b" stroke-width="3"/>
  <g stroke="#f59e0b" stroke-width="3" stroke-linecap="round">
    <line x1="62" y1="16" x2="62" y2="8"/>
    <line x1="62" y1="88" x2="62" y2="96"/>
    <line x1="26" y1="52" x2="18" y2="52"/>
    <line x1="98" y1="52" x2="106" y2="52"/>
    <line x1="36" y1="26" x2="30" y2="20"/>
    <line x1="88" y1="78" x2="94" y2="84"/>
  </g>

  <!-- Tua-bin điện gió trắng -->
  <line x1="145" y1="75" x2="145" y2="195" stroke="#ffffff" stroke-width="6"/>
  <line x1="145" y1="75" x2="145" y2="195" stroke="#64748b" stroke-width="1.5"/>
  <ellipse cx="138" cy="75" rx="14" ry="6" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <path d="M145 75 L148 24 L142 75 Z" fill="#1e2260"/>
  <path d="M145 75 L182 108 L143 78 Z" fill="#1e2260"/>
  <path d="M145 75 L108 102 L144 72 Z" fill="#1e2260"/>
  <circle cx="145" cy="75" r="4.5" fill="#d7262d"/>

  <!-- Cờ Đỏ Sao Vàng tung bay -->
  <line x1="342" y1="56" x2="346" y2="185" stroke="#334155" stroke-width="3.5"/>
  <path d="M302 60 Q322 55 342 60 L343 88 Q322 83 302 88 Z" fill="#d7262d"/>
  <polygon points="322,66 324,72 330,72 325,75 327,81 322,77 317,81 319,75 314,72 320,72" fill="#facc15"/>

  <!-- Dàn Tấm Pin Năng Lượng Mặt Trời Áp Mái (Bản quyền đồ họa Đất Phú - Không dính watermark) -->
  <!-- Dàn phía sau -->
  <polygon points="175,148 310,142 348,188 195,195" fill="url(#pvCell)" stroke="#ffffff" stroke-width="3"/>
  <line x1="220" y1="146" x2="246" y2="193" stroke="#93c5fd" stroke-width="1.4"/>
  <line x1="265" y1="144" x2="296" y2="190" stroke="#93c5fd" stroke-width="1.4"/>
  <line x1="185" y1="171" x2="328" y2="165" stroke="#93c5fd" stroke-width="1.4"/>

  <!-- Dàn chính tiền cảnh lớn -->
  <polygon points="15,172 225,162 295,295 0,295" fill="url(#pvCell)" stroke="#ffffff" stroke-width="4"/>
  <!-- Đường kẻ ô tế bào quang điện (Solar Cells) -->
  <g stroke="#93c5fd" stroke-width="1.6" opacity="0.85">
    <line x1="70" y1="169" x2="88" y2="295"/>
    <line x1="125" y1="166" x2="160" y2="295"/>
    <line x1="178" y1="164" x2="230" y2="295"/>
    <line x1="8" y1="205" x2="246" y2="195"/>
    <line x1="4" y1="245" x2="268" y2="236"/>
    <line x1="0" y1="282" x2="288" y2="275"/>
  </g>
</svg>
