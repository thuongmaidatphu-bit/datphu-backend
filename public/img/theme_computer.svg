<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgComp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="60%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <!-- Nền phòng làm việc hiện đại -->
  <rect width="400" height="210" fill="url(#bgComp)"/>
  <rect x="0" y="210" width="400" height="90" fill="#e2e8f0"/>
  <line x1="0" y1="210" x2="400" y2="210" stroke="#cbd5e1" stroke-width="3"/>

  <!-- Tường & Sóng WiFi gia đình -->
  <path d="M70 70 A50 50 0 0 1 130 70" fill="none" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M80 82 A35 35 0 0 1 120 82" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
  <path d="M90 94 A20 20 0 0 1 110 94" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="100" cy="102" r="3" fill="#2563eb"/>

  <!-- Màn hình máy tính bàn lớn (PC Monitor) -->
  <!-- Chân đế màn hình -->
  <ellipse cx="230" cy="225" rx="36" ry="8" fill="#94a3b8"/>
  <rect x="224" y="175" width="12" height="50" fill="#64748b" rx="2"/>

  <!-- Khung màn hình -->
  <rect x="130" y="45" width="200" height="135" rx="10" fill="#0f172a" stroke="#334155" stroke-width="4"/>
  <!-- Mặt kính hiển thị -->
  <rect x="136" y="51" width="188" height="115" rx="6" fill="url(#screenGrad)"/>

  <!-- Giao diện bảo trì kỹ thuật trên màn hình -->
  <rect x="144" y="58" width="172" height="16" rx="3" fill="#1e293b"/>
  <circle cx="152" cy="66" r="3" fill="#ef4444"/>
  <circle cx="160" cy="66" r="3" fill="#facc15"/>
  <circle cx="168" cy="66" r="3" fill="#22c55e"/>

  <!-- Mã code & thanh đo tốc độ tối ưu hệ thống -->
  <rect x="146" y="82" width="90" height="7" rx="3" fill="url(#codeGrad)"/>
  <rect x="146" y="94" width="130" height="6" rx="3" fill="#94a3b8" opacity="0.6"/>
  <rect x="146" y="105" width="110" height="6" rx="3" fill="#94a3b8" opacity="0.5"/>
  <rect x="146" y="116" width="75" height="6" rx="3" fill="#94a3b8" opacity="0.4"/>

  <!-- Biểu đồ CPU / RAM xanh mát -->
  <rect x="246" y="82" width="68" height="42" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
  <polyline points="250,115 258,105 266,112 274,96 282,102 292,88 308,98" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bàn phím cơ & Chuột -->
  <rect x="160" y="222" width="140" height="12" rx="3" fill="#334155"/>
  <rect x="162" y="224" width="136" height="4" fill="#64748b"/>
  <rect x="312" y="222" width="14" height="20" rx="6" fill="#475569"/>

  <!-- Laptop mở góc chéo phía trước -->
  <polygon points="50,225 125,225 140,245 35,245" fill="#475569" stroke="#334155" stroke-width="1.5"/>
  <polygon points="55,227 120,227 132,240 45,240" fill="#1e293b"/>
  <!-- Màn hình laptop dựng đứng -->
  <polygon points="50,225 125,225 125,155 50,155" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="54" y="159" width="67" height="62" fill="#0284c7" rx="2"/>
  <path d="M62 185 L74 195 L95 175" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Logo Đất Phú Tech Shield -->
  <circle cx="340" cy="75" r="24" fill="#d7262d" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M340 60 L354 66 V78 C354 88 340 94 340 94 C340 94 326 88 326 78 V66 Z" fill="#ffffff"/>
  <polygon points="340,68 344,76 335,76" fill="#d7262d"/>
</svg>