<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="skyIron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="65%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="beamSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="arcGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#60a5fa"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Nền trời & công trình sân thượng -->
  <rect width="400" height="200" fill="url(#skyIron)"/>
  <rect x="0" y="200" width="400" height="100" fill="#e2e8f0"/>
  <line x1="0" y1="200" x2="400" y2="200" stroke="#cbd5e1" stroke-width="3"/>

  <!-- Tường bao sân thượng / nhà phố Tuy Hòa -->
  <rect x="0" y="160" width="400" height="40" fill="#f8fafc"/>
  <line x1="0" y1="160" x2="400" y2="160" stroke="#94a3b8" stroke-width="2"/>

  <!-- Khung kết cấu sắt hộp / xà gồ mái che (Steel frame structure) -->
  <!-- Cột sắt 1 -->
  <rect x="50" y="70" width="16" height="130" fill="url(#steelGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="46" y="195" width="24" height="8" fill="#1e293b" rx="2"/>

  <!-- Cột sắt 2 -->
  <rect x="210" y="50" width="18" height="150" fill="url(#steelGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="205" y="195" width="28" height="8" fill="#1e293b" rx="2"/>

  <!-- Cột sắt 3 (xa) -->
  <rect x="330" y="80" width="14" height="120" fill="url(#steelGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="326" y="195" width="22" height="8" fill="#1e293b" rx="2"/>

  <!-- Dầm sắt ngang chính (Main steel truss / I-beam) -->
  <rect x="40" y="65" width="315" height="16" fill="url(#beamSteel)" stroke="#0f172a" stroke-width="1.5" rx="2"/>
  <rect x="40" y="45" width="200" height="12" fill="url(#beamSteel)" stroke="#0f172a" stroke-width="1.5" rx="2"/>

  <!-- Khung đan giằng chéo (Truss diagonal bracing) -->
  <line x1="50" y1="65" x2="110" y2="45" stroke="#475569" stroke-width="3"/>
  <line x1="110" y1="45" x2="160" y2="65" stroke="#475569" stroke-width="3"/>
  <line x1="160" y1="65" x2="210" y2="45" stroke="#475569" stroke-width="3"/>
  <line x1="110" y1="45" x2="110" y2="65" stroke="#475569" stroke-width="3"/>
  <line x1="160" y1="45" x2="160" y2="65" stroke="#475569" stroke-width="3"/>

  <!-- Thước đo / Sắt hộp nằm dưới sàn -->
  <rect x="90" y="235" width="180" height="8" fill="#475569" rx="1"/>
  <rect x="120" y="248" width="160" height="8" fill="#64748b" rx="1"/>
  <rect x="70" y="260" width="220" height="9" fill="#334155" rx="1"/>

  <!-- Máy hàn que & dây hàn -->
  <rect x="260" y="215" width="55" height="38" fill="#d97706" stroke="#92400e" stroke-width="2" rx="6"/>
  <rect x="270" y="222" width="35" height="14" fill="#1e293b" rx="2"/>
  <circle cx="277" cy="229" r="3" fill="#22c55e"/>
  <circle cx="288" cy="229" r="3" fill="#ef4444"/>
  <path d="M285 215 Q285 208 288 208 Q291 208 291 215" fill="none" stroke="#1e293b" stroke-width="3"/>
  <!-- Dây hàn uốn lượn -->
  <path d="M260 238 C230 250 200 240 170 215 C150 190 145 130 140 100" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Thợ hàn với nón bảo hộ & mỏ hàn đang thi công -->
  <!-- Nón thợ bảo hộ màu cam -->
  <ellipse cx="115" cy="115" rx="15" ry="12" fill="#ea580c"/>
  <path d="M100 118 Q115 110 130 118" stroke="#c2410c" stroke-width="2" fill="none"/>
  <!-- Mặt nạ hàn bảo hộ -->
  <rect x="122" y="112" width="12" height="18" fill="#1e293b" rx="3"/>
  <rect x="127" y="117" width="5" height="8" fill="#38bdf8" opacity="0.9"/>
  <!-- Áo bảo hộ thợ cơ khí -->
  <path d="M102 128 L128 128 L136 175 L95 175 Z" fill="#f97316"/>
  <path d="M108 140 L122 140" stroke="#fde047" stroke-width="4"/>

  <!-- Tay cầm kìm hàn -->
  <path d="M125 140 L145 110" stroke="#ea580c" stroke-width="8" stroke-linecap="round"/>
  <!-- Que hàn & Mỏ hàn -->
  <line x1="145" y1="110" x2="160" y2="72" stroke="#e2e8f0" stroke-width="3.5" stroke-linecap="round"/>

  <!-- TIA LỬA HỒ QUANG HÀN XÌ (WELDING ARC & SPARKS) -->
  <circle cx="160" cy="72" r="22" fill="url(#arcGlow)"/>
  <polygon points="160,58 163,69 174,72 163,75 160,86 157,75 146,72 157,69" fill="#ffffff"/>
  <!-- Tia lửa tóe ra -->
  <g stroke="#f59e0b" stroke-width="2" stroke-linecap="round">
    <line x1="160" y1="72" x2="180" y2="60"/>
    <line x1="160" y1="72" x2="175" y2="88"/>
    <line x1="160" y1="72" x2="142" y2="54"/>
    <line x1="160" y1="72" x2="148" y2="92"/>
    <line x1="160" y1="72" x2="190" y2="76"/>
    <line x1="160" y1="72" x2="135" y2="74"/>
  </g>
  <circle cx="182" cy="58" r="2" fill="#facc15"/>
  <circle cx="178" cy="90" r="2.5" fill="#facc15"/>
  <circle cx="140" cy="52" r="2" fill="#ffffff"/>
  <circle cx="192" cy="78" r="1.5" fill="#facc15"/>
</svg>