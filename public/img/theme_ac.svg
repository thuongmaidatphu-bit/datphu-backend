<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="acWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="acBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="coolWave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Nền tường hoa văn hiện đại -->
  <rect width="400" height="300" fill="url(#acWall)"/>
  <g stroke="#c7d2fe" stroke-width="1.2" opacity="0.6">
    <line x1="50" y1="0" x2="50" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="300"/>
    <line x1="190" y1="0" x2="190" y2="300"/>
    <line x1="260" y1="0" x2="260" y2="300"/>
    <line x1="330" y1="0" x2="330" y2="300"/>
  </g>

  <!-- Thân Dàn Lạnh Điều Hòa Inverter Treo Tường (Đất Phú Care - Không dính nhãn hiệu hãng khác) -->
  <rect x="34" y="54" width="332" height="106" rx="18" fill="url(#acBody)" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Đường viền mỹ thuật Đỏ - Xanh Đất Phú trên mặt máy lạnh -->
  <rect x="52" y="72" width="84" height="38" rx="10" fill="#1e2260"/>
  <text x="94" y="90" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="900">ĐẤT PHÚ</text>
  <text x="94" y="103" text-anchor="middle" fill="#ff8a8a" font-family="Segoe UI, sans-serif" font-size="9" font-weight="800">INVERTER 6K</text>

  <!-- Cụm màn hình LED hiển thị nhiệt độ mát lạnh 25°C -->
  <rect x="296" y="80" width="48" height="24" rx="6" fill="#0f172a"/>
  <text x="320" y="97" text-anchor="middle" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="13" font-weight="900">25°C</text>

  <!-- Tem tiết kiệm năng lượng 5 sao (Thiết kế riêng) -->
  <rect x="256" y="74" width="28" height="34" rx="4" fill="#d7262d"/>
  <text x="270" y="92" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="9" font-weight="900">5★</text>
  <text x="270" y="102" text-anchor="middle" fill="#fde047" font-family="Segoe UI, sans-serif" font-size="7" font-weight="800">ECO</text>

  <!-- Cánh đảo gió mở nghiêng (Louver) -->
  <polygon points="48,142 352,142 338,166 62,166" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <line x1="145" y1="142" x2="140" y2="166" stroke="#94a3b8" stroke-width="2"/>
  <line x1="255" y1="142" x2="260" y2="166" stroke="#94a3b8" stroke-width="2"/>

  <!-- Luồng khí lạnh lan tỏa xuống dưới -->
  <path d="M85 170 Q70 225 45 275" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6"/>
  <path d="M160 172 Q155 230 140 280" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6"/>
  <path d="M240 172 Q245 230 260 280" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6"/>
  <path d="M315 170 Q330 225 355 275" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6"/>

  <!-- Bông tuyết mát lạnh trung tâm -->
  <g transform="translate(200, 228)" stroke="#1e2260" stroke-width="3.5" stroke-linecap="round">
    <line x1="0" y1="-26" x2="0" y2="26"/>
    <line x1="-22" y1="-13" x2="22" y2="13"/>
    <line x1="-22" y1="13" x2="22" y2="-13"/>
    <circle cx="0" cy="0" r="7" fill="#d7262d" stroke="#ffffff" stroke-width="2"/>
  </g>
</svg>
