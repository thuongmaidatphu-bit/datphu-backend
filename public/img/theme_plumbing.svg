<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgWall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e2260"/>
      <stop offset="100%" stop-color="#2e388d"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d7262d"/>
      <stop offset="100%" stop-color="#a8151b"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <!-- Nền showroom thiết bị vệ sinh & điện nước Đất Phú -->
  <rect width="400" height="300" fill="url(#bgWall)"/>
  <!-- Kẻ ô gạch men sang trọng -->
  <g stroke="#cbd5e1" stroke-width="1" opacity="0.55">
    <line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="180" x2="400" y2="180"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="80" y1="0" x2="80" y2="240"/>
    <line x1="160" y1="0" x2="160" y2="240"/>
    <line x1="240" y1="0" x2="240" y2="240"/>
    <line x1="320" y1="0" x2="320" y2="240"/>
  </g>

  <!-- Dải bảng hiệu Đỏ - Xanh Đất Phú phía trên -->
  <rect x="0" y="0" width="400" height="38" fill="url(#navyGrad)"/>
  <rect x="0" y="34" width="400" height="5" fill="#d7262d"/>
  <text x="20" y="24" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="800" letter-spacing="0.5">ĐẤT PHÚ 6K • ĐIỆN NƯỚC &amp; THIẾT BỊ VỆ SINH</text>

  <!-- Tấm ốp trưng bày Sen cây cao cấp (Đỏ Đất Phú) -->
  <rect x="265" y="52" width="44" height="175" rx="6" fill="url(#redGrad)" opacity="0.92"/>
  <rect x="330" y="52" width="44" height="175" rx="6" fill="url(#navyGrad)" opacity="0.92"/>

  <!-- Cây sen tắm đứng (Rain Shower Column) -->
  <path d="M287 195 V75 Q287 58 265 58 H245" fill="none" stroke="url(#chrome)" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="242" cy="61" rx="22" ry="6" fill="#1e2260" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Tia nước phun từ vòi sen -->
  <g stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="4 5">
    <line x1="230" y1="72" x2="222" y2="135"/>
    <line x1="242" y1="72" x2="242" y2="140"/>
    <line x1="254" y1="72" x2="262" y2="135"/>
  </g>
  <!-- Củ sen trộn nóng lạnh -->
  <rect x="272" y="165" width="30" height="14" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>

  <!-- Cây sen thứ 2 -->
  <path d="M352 195 V82 Q352 66 334 66 H320" fill="none" stroke="url(#chrome)" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="318" cy="69" rx="16" ry="5" fill="#d7262d" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Bồn rửa Lavabo sứ trắng & Vòi nước -->
  <rect x="30" y="165" width="115" height="32" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
  <rect x="38" y="197" width="99" height="45" rx="4" fill="#1e2260"/>
  <path d="M87 165 V142 Q87 132 100 132 H105" fill="none" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
  <circle cx="105" cy="146" r="3.5" fill="#0ea5e9"/>
  <circle cx="105" cy="156" r="3.5" fill="#0ea5e9"/>

  <!-- Bồn cầu sứ trắng liền khối -->
  <rect x="165" y="138" width="52" height="48" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
  <rect x="162" y="134" width="58" height="8" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M160 186 H228 Q232 218 212 242 H174 Q158 218 160 186 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- Sàn gạch showroom -->
  <rect x="0" y="242" width="400" height="58" fill="#1e2260"/>
  <path d="M0 242 H400" stroke="#d7262d" stroke-width="4"/>

  <!-- Huy hiệu Tia Sét Điện & Giọt Nước An Toàn -->
  <circle cx="62" cy="95" r="32" fill="#ffffff" stroke="#d7262d" stroke-width="3.5"/>
  <polygon points="64 69 47 96 61 96 58 121 77 92 63 92 64 69" fill="#d7262d"/>
</svg>
